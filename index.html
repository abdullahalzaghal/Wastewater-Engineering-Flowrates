                        <div className="bg-white p-6 rounded-2xl shadow-md border-t-4 border-indigo-500">
                            <div className="bg-indigo-50 p-5 rounded-xl mb-5 border border-indigo-100 text-left">
                                <h4 className="font-black text-indigo-900 en-font text-lg mb-2 tracking-widest" dir="ltr">PROBLEM:</h4>
                                <p className="en-font font-bold text-slate-700 text-base leading-relaxed" dir="ltr">
                                    A city has a population of 20,000. The average wastewater flow is 380 Lpcd. 
                                    Calculate the daily average and hourly peak dry weather flows in m³/d.
                                </p>
                            </div>
                            <div className="space-y-4 text-left en-font">
                                <h4 className="font-black text-slate-800 text-xl border-b-2 pb-2 mb-3 tracking-widest" dir="ltr">SOLUTION:</h4>
                                
                                <div className="p-4 bg-slate-50 rounded-xl flex flex-col md:flex-row justify-between items-center border border-slate-200 gap-2" dir="ltr">
                                    <span className="font-bold text-slate-600 text-base">1. Daily Average Flow:</span>
                                    <span className="font-black text-lg text-indigo-700">20,000 × 380 / 1000 = 7,600 m³/d</span>
                                </div>
                                
                                <div className="p-4 bg-slate-50 rounded-xl flex flex-col md:flex-row justify-between items-center border border-slate-200 gap-2" dir="ltr">
                                    <span className="font-bold text-slate-600 text-base">2. Peaking Factor (P=20):</span>
                                    <span className="font-black text-lg text-indigo-700">1 + [14 / (4 + √20)] = 2.65</span>
                                </div>
                                
                                <div className="p-5 bg-indigo-600 rounded-xl flex flex-col md:flex-row justify-between items-center text-white shadow-md mt-4" dir="ltr">
                                    <span className="font-black text-lg">3. Hourly Peak Dry Flow:</span>
                                    <span className="font-black text-2xl">2.65 × 7,600 = 20,140 m³/d</span>
                                </div>
                            </div>
                        </div>
                    )
                },
                {
                    title: "EXAMPLE 2: Peak Wet Weather Flow",
                    subtitle: "إضافة تأثير مياه الارتشاح (I/I) للتصميم",
                    content: (
                        <div className="bg-white p-6 rounded-2xl shadow-md border-t-4 border-emerald-500 text-left en-font">
                            <div className="bg-emerald-50 p-4 rounded-xl mb-4 border border-emerald-100" dir="ltr">
                                <h4 className="font-black text-emerald-900 text-base mb-1 tracking-widest">PROBLEM:</h4>
                                <p className="font-bold text-slate-700 text-sm leading-relaxed">
                                    Pop: 40,000. Avg flow: 400 Lpcd. Network length: 320 km. Composite Dia: 23 cm. <br/>
                                    I/I allowance: 890 L/cm.km.d. I/I peak factor: 1.6. Calculate Peak Wet Weather Flow.
                                </p>
                            </div>
                            <div className="space-y-3" dir="ltr">
                                <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-2">
                                    <span className="font-bold text-slate-600 text-base">1. Peak Dry Weather:</span>
                                    <div className="text-center md:text-right">
                                        <div className="text-xs text-slate-500 mb-1">Avg = 16,000. PF(P=40) = 2.36</div>
                                        <div className="font-black text-emerald-700 text-lg">16,000 × 2.36 = 37,760 m³/d</div>
                                    </div>
                                </div>
                                
                                <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-2">
                                    <span className="font-bold text-slate-600 text-base">2. Peak I/I (Infiltration):</span>
                                    <div className="text-center md:text-right">
                                        <div className="text-xs text-slate-500 mb-1">Avg I/I = (890 × 23 × 320) / 1000 = 6,550</div>
                                        <div className="font-black text-emerald-700 text-lg">Peak I/I = 6,550 × 1.6 = 10,480 m³/d</div>
                                    </div>
                                </div>
                                
                                <div className="p-4 bg-emerald-600 rounded-xl flex flex-col md:flex-row justify-between items-center text-white shadow-md mt-2">
                                    <span className="font-black text-lg">3. Total Peak Wet Weather:</span>
                                    <span className="font-black text-xl">37,760 + 10,480 = 48,240 m³/d</span>
                                </div>
                            </div>
                        </div>
                    )
                },
                {
                    title: "EXAMPLE 3: Analyzing Storm Data",
                    subtitle: "فصل الارتشاح الجوفي عن التدفق المباشر (Infiltration vs Inflow)",
                    content: (
                        <div className="bg-white p-6 rounded-2xl shadow-md border-t-4 border-rose-500 text-left en-font">
                            <div className="bg-rose-50 p-4 rounded-xl mb-5 border border-rose-100" dir="ltr">
                                <h4 className="font-black text-rose-900 text-base mb-1 tracking-widest">PROBLEM (Graph Analysis):</h4>
                                <p className="font-bold text-slate-700 text-sm leading-relaxed">
                                    Dry period = 120,000 m³/d. Wet period = 230,000 m³/d. <br/>
                                    Storm peak = 606,000 m³/d. Preceding day = 340,000 m³/d. <br/>
                                    Network L×D = 270,000 mm.km. Is infiltration excessive (&gt; 0.75 m³/(d·mm·km))?
                                </p>
                            </div>
                            <div className="space-y-3" dir="ltr">
                                <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-2">
                                    <span className="font-bold text-slate-600 text-base">1. Infiltration (Wet - Dry):</span>
                                    <span className="font-black text-rose-700 text-lg">230,000 - 120,000 = 110,000 m³/d</span>
                                </div>
                                
                                <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-2">
                                    <span className="font-bold text-slate-600 text-base">2. Inflow (Storm - Preceding):</span>
                                    <span className="font-black text-rose-700 text-lg">606,000 - 340,000 = 266,000 m³/d</span>
                                </div>
                                
                                <div className="p-4 bg-rose-600 rounded-xl flex flex-col md:flex-row justify-between items-center text-white shadow-md mt-2">
                                    <span className="font-black text-lg">3. Excessive Check:</span>
                                    <div className="text-center md:text-right">
                                        <div className="font-black text-xl mb-1">110,000 / 270,000 = 0.407</div>
                                        <div className="text-xs font-bold bg-white/20 px-3 py-1 rounded-lg inline-block">
                                            <span dir="ltr" className="inline-block">0.407 &lt; 0.75 m³/(d·mm·km) ➔ NOT Excessive</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )
                },
                {
                    title: "EXAMPLE 4: Forecasting Design Flows",
                    subtitle: "حساب التدفقات للمستقبل (النمو السكاني، كليات، مصانع)",
                    content: (
                        <div className="bg-white p-6 rounded-2xl shadow-md border-t-4 border-cyan-500 text-left en-font">
                            <div className="bg-cyan-50 p-4 rounded-xl mb-4 border border-cyan-100" dir="ltr">
                                <p className="font-bold text-slate-700 text-sm leading-relaxed">
                                    Current pop=40k. Future pop=55k. Current total flow=18,400. I/I=80 Lpcd. Peak I/I=180. 
                                    College adds 50 Lpcd for 1500 students. Industry adds 900 m³/d (Peak 1500). 
                                    10% reduction in flow for future pop growth. Calculate Design Avg & Peak.
                                </p>
                            </div>
                            <div className="space-y-2" dir="ltr">
                                <div className="p-3 bg-slate-50 rounded-lg border border-slate-200 flex justify-between items-center text-sm">
                                    <span className="font-bold text-slate-600">1. Current Net Flow:</span>
                                    <span className="font-black text-cyan-700 text-base">18,400 - (40k×80/1k) = 15,200 m³/d</span>
                                </div>
                                <div className="p-3 bg-slate-50 rounded-lg border border-slate-200 flex justify-between items-center text-sm">
                                    <span className="font-bold text-slate-600">2. Future Add (15k pop):</span>
                                    <span className="font-black text-cyan-700 text-base">15k × (380×0.9) / 1000 = 5,130 m³/d</span>
                                </div>
                                <div className="p-3 bg-slate-50 rounded-lg border border-slate-200 flex justify-between items-center text-sm">
                                    <span className="font-bold text-slate-600">3. College Flow:</span>
                                    <span className="font-black text-cyan-700 text-base">1500 × 50 / 1000 = 75 m³/d</span>
                                </div>
                                <div className="p-3 bg-slate-50 rounded-lg border border-slate-200 flex justify-between items-center text-sm">
                                    <span className="font-bold text-slate-600">4. Peaking Factor (Harmon, P=55):</span>
                                    <span className="font-black text-cyan-700 text-base">1 + [14 / (4 + √55)] = 2.23</span>
                                </div>

                                <div className="p-4 bg-cyan-600 rounded-lg flex flex-col md:flex-row justify-between items-center text-white shadow-sm gap-1 mt-2">
                                    <span className="font-black text-base">Design Daily Avg:</span>
                                    <span className="font-black text-lg">(15200+5130+75) + 900 + 4400 = 25,705 m³/d</span>
                                </div>
                                <div className="p-4 bg-slate-900 rounded-lg flex flex-col md:flex-row justify-between items-center text-white shadow-sm gap-1">
                                    <span className="font-black text-base">Design Peak Hour:</span>
                                    <span className="font-black text-lg">(20405 × 2.23) + 1500 + 9900 = 56,900 m³/d</span>
                                </div>
                            </div>
                        </div>
                    )
                },
                {
                    title: "SUMMARY | الخلاصة",
                    subtitle: "القواعد الذهبية لتصميم شبكات الصرف الصحي",
                    content: (
                        <div className="space-y-4 mt-2">
                            <div className="grid grid-cols-1 gap-3 text-right">
                                {[
                                    "تقدير التدفق بدقة هو الخطوة الأولى والأساسية لتصميم أي نظام معالجة ناجح.",
                                    "عامل الذروة (Peaking Factor) هو صمام الأمان الذي يحمينا من فيضان المياه.",
                                    "الارتشاح (Infiltration) هو تسرب المياه الجوفية، ويُحسب (Wet - Dry).",
                                    "التدفق (Inflow) هو مياه الأمطار من المناهل، ويُحسب (Peak - Preceding).",
                                    "تُصمم المواسير الرئيسية لـ 50 عاماً لأن تكلفة حفرها باهظة، والمحطات لـ 20 عاماً."
                                ].map((txt, i) => (
                                    <div key={i} className="p-4 bg-white rounded-xl border-r-4 border-blue-600 font-black text-slate-700 shadow-sm flex items-center justify-end gap-3 text-base leading-relaxed">
                                        <span>
                                            {txt.split(' (').map((part, idx) => {
                                                if (idx === 0) return part;
                                                const enPart = part.split(')')[0];
                                                const arPart = part.split(')')[1];
                                                return (
                                                    <React.Fragment key={idx}>
                                                        <span dir="ltr" className="inline-block text-blue-600 en-font text-sm mx-1 font-bold">({enPart})</span>
                                                        {arPart}
                                                    </React.Fragment>
                                                )
                                            })}
                                        </span>
                                    </div>
                                ))}
                            </div>
                            <div className="p-6 bg-slate-900 text-white rounded-2xl text-center font-black en-font shadow-md border-b-4 border-emerald-500 text-2xl tracking-[0.2em] mt-6">
                                THANK YOU
                            </div>
                        </div>
                    )
                }
            ];

            const next = () => setCurrentSlide((s) => (s + 1) % slides.length);
            const prev = () => setCurrentSlide((s) => (s - 1 + slides.length) % slides.length);

            useEffect(() => {
                const handleKey = (e) => {
                    if (e.key === 'ArrowRight') next(); 
                    if (e.key === 'ArrowLeft') prev();
                };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, []);

            return (
                <div className="w-full h-[100dvh] md:h-[95vh] md:w-[96vw] max-w-[1400px] bg-white md:rounded-[1.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.2)] flex flex-col relative md:border-2 border-slate-200 overflow-hidden mx-auto">
                    
                    {/* Header */}
                    <div className="px-6 md:px-8 py-3 md:py-4 border-b flex justify-between items-center bg-white z-20 shrink-0">
                        <div className="flex-1">
                            <h1 className="text-xl md:text-2xl font-black text-slate-900 en-font uppercase tracking-tighter">
                                {slides[currentSlide].title}
                            </h1>
                            <p className="text-slate-500 font-bold text-xs md:text-sm tracking-wide mt-1 ar-font">
                                {slides[currentSlide].subtitle}
                            </p>
                        </div>
                        <div className="text-left hidden lg:block border-r-2 pr-6 border-blue-600 bg-slate-50 p-2 px-4 rounded-xl">
                            <p className="text-[10px] text-slate-400 font-black tracking-[0.1em] uppercase mb-1">Presented By</p>
                            <p className="text-lg font-black text-blue-700 en-font italic leading-none tracking-tight">LANA R. MARAR</p>
                        </div>
                    </div>

                    {/* Content Area */}
                    <div className="flex-grow p-4 md:p-8 bg-slate-50 flex flex-col items-center justify-center z-10 relative overflow-y-auto">
                        <div key={currentSlide} className="w-full max-w-5xl slide-fade">
                            {slides[currentSlide].content}
                        </div>
                    </div>

                    {/* Footer */}
                    <div className="px-6 md:px-8 py-3 md:py-4 bg-white border-t flex justify-between items-center z-20 shrink-0 shadow-[0_-10px_30px_rgba(0,0,0,0.02)]">
                        <button 
                            onClick={next}
                            className="px-8 md:px-10 py-2 md:py-3 bg-blue-600 text-white rounded-xl font-black transition-all shadow-md hover:bg-blue-700 uppercase text-xs md:text-sm tracking-widest active:scale-95"
                        >
                            {currentSlide === slides.length - 1 ? "RESTART" : "التالي (NEXT)"}
                        </button>

                        <div className="flex gap-2 md:gap-3 flex-row-reverse">
                            {slides.map((_, i) => (
                                <div 
                                    key={i} 
                                    onClick={() => setCurrentSlide(i)}
                                    className={`h-2 md:h-3 rounded-full transition-all duration-300 cursor-pointer ${i === currentSlide ? 'w-10 md:w-16 bg-blue-600 shadow-md' : 'w-2 md:w-3 bg-slate-300 hover:bg-slate-400'}`}
                                ></div>
                            ))}
                        </div>

                        <button 
                            onClick={prev}
                            className="px-6 md:px-8 py-2 md:py-3 bg-slate-100 border border-slate-200 rounded-xl font-black text-slate-600 transition-all hover:bg-slate-200 uppercase text-xs md:text-sm tracking-widest active:scale-95"
                        >
                            السابق (BACK)
                        </button>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>
</html>
